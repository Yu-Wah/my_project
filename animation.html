<!DOCTYPE html>
<head>
    <title>animation</title>

<style>
    body{ height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    } 
    div{
        width: 300px;
        height: 300px;
        background-color: aqua;
        border-radius: 50%;
       
        animation-name: beat;
        animation-duration: 1s;
        animation-timing-function: linear;
        animation-direction: alternate;
        animation-iteration-count: infinite;
    }
    
    @keyframes beat {
        from{
            transform: scale(0);
        }
        to{
            transform: scale(1);
        }
    }
</style>    
</head>
<body>
    <div></div>


</body>
